<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LostFound | Campus Community</title><link rel="stylesheet" href="style.css"></head><body>
<nav class="nav"><a class="brand" href="index.html"><span>LF</span><div>LostFound<small>Campus community</small></div></a><div class="nav-actions"><button class="ghost" onclick="toggleTheme()">Theme</button><button class="ghost" onclick="goToMyPosts()">My Posts</button><button class="primary small" onclick="goToPost()">Post Item</button><button class="ghost" onclick="logout()">Logout</button></div></nav>
<main><section class="hero"><div><p class="eyebrow">CAMPUS LOST & FOUND</p><h1>Lost something?<br><strong>Let's get it back.</strong></h1><p class="hero-copy">A simple place for students to report lost items, share found belongings, and reconnect them with their owners.</p><div class="hero-actions"><button class="primary" onclick="goToPost()">Report an item</button><button class="secondary" onclick="document.getElementById('search').focus()">Browse items</button></div></div><div class="hero-card"><div class="stat"><strong id="totalCount">0</strong><span>Items posted</span></div><div class="stat"><strong id="activeCount">0</strong><span>Still searching</span></div><div class="stat"><strong id="returnedCount">0</strong><span>Returned</span></div></div></section>
<section class="toolbar"><input id="search" placeholder="Search by item, location or category..." oninput="displayItems()"><select id="typeFilter" onchange="displayItems()"><option value="All">All items</option><option value="Lost">Lost</option><option value="Found">Found</option></select><select id="categoryFilter" onchange="displayItems()"><option value="All">All categories</option></select><select id="statusFilter" onchange="displayItems()"><option value="All">All statuses</option><option value="Searching">Searching</option><option value="Submitted">Submitted</option><option value="Returned">Returned</option></select><select id="sortFilter" onchange="displayItems()"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="urgent">Urgent first</option></select></section>
<section class="section-head"><div><p class="eyebrow">COMMUNITY BOARD</p><h2>Recent reports</h2></div><span id="resultCount" class="muted"></span></section><section id="itemsContainer" class="grid"></section></main>
<button class="fab" onclick="goToPost()">+</button><div id="modal" class="modal" onclick="closeModal()"><div class="modal-card" onclick="event.stopPropagation()"><button class="modal-close" onclick="closeModal()">×</button><img id="modalImg" alt="Item preview"></div></div><div id="toast" class="toast"></div><script src="script.js"></script></body></html>
