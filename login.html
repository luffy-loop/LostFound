<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | LostFound</title><link rel="stylesheet" href="style.css"></head><body class="login-page"><div class="login-bg"></div><main class="login-shell"><div class="login-card"><div class="logo-mark">LF</div><p class="eyebrow">CAMPUS LOST & FOUND</p><h1>Welcome back.</h1><p>Enter your 10-digit campus roll number to continue.</p><label for="roll">Roll number</label><input id="roll" inputmode="numeric" maxlength="10" placeholder="e.g. 2510030093" onkeydown="if(event.key==='Enter') login()"><button class="primary full" onclick="login()">Continue</button><small>This demo uses your roll number as a local browser identity.</small></div></main><div id="toast" class="toast"></div><script src="script.js"></script></body></html>
