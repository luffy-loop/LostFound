<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Post Item | LostFound</title><link rel="stylesheet" href="style.css"></head><body><nav class="nav"><a class="brand" href="index.html"><span>LF</span><div>LostFound<small>Campus community</small></div></a><button class="ghost" onclick="goHome()">Back to board</button></nav><main class="form-page"><div class="form-intro"><p class="eyebrow">NEW REPORT</p><h1>Tell the campus what happened.</h1><p>Add enough detail for someone to recognise the item without exposing sensitive information.</p></div><form class="post-card" onsubmit="event.preventDefault(); addItem()"><div class="segmented"><button type="button" class="active" id="lostBtn" onclick="setType('Lost')">I lost something</button><button type="button" id="foundBtn" onclick="setType('Found')">I found something</button></div><input type="hidden" id="type" value="Lost"><div class="form-grid"><div><label>Item name</label><input id="itemName" maxlength="60" placeholder="Black water bottle" required></div><div><label>Category</label><select id="category"><option>Electronics</option><option>Documents</option><option>Accessories</option><option>Bags</option><option>Keys</option><option>Clothing</option><option>Books</option><option>Other</option></select></div></div><label>Description</label><textarea id="description" maxlength="300" placeholder="Colour, brand, markings, or other useful details..." required></textarea><div class="form-grid"><div><label>Location</label><input id="location" maxlength="80" placeholder="Library, Block A..." required></div><div><label>Image</label><input type="file" id="image" accept="image/*" onchange="previewImage()"></div></div><label class="check"><input type="checkbox" id="urgent"> Mark as urgent</label><img id="preview" class="preview" alt="Preview"><button class="primary full" type="submit">Publish report</button></form></main><div id="toast" class="toast"></div><script src="script.js"></script></body></html>
